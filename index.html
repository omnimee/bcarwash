<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BCar Wash & Detailing</title>
<meta name="theme-color" content="#0a1a4f">
<meta name="description" content="Booking, antrian, dan manajemen BCar Wash & Detailing">
<style>
:root{--bg:#f1f4fb;--card:#fff;--tx:#0f1b3d;--mut:#5b6785;--bd:#dce2f0;--pri:#1e5bd8;--navy:#0a1a4f;--ok:#118a4a;--warn:#b7791f;--bad:#c0392b;--soft:#eaf0ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#141b33;--tx:#eef2ff;--mut:#9aa6c7;--bd:#263056;--soft:#1b2750}}
:root[data-theme="dark"]{--bg:#0b1020;--card:#141b33;--tx:#eef2ff;--mut:#9aa6c7;--bd:#263056;--soft:#1b2750}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,var(--navy),var(--pri));color:#fff;border-radius:18px;padding:18px;display:flex;gap:14px;align-items:center}
.hero h1{margin:0;font-size:22px;line-height:1.15}
.hero p{margin:4px 0 0;opacity:.9}
.logo{width:64px;height:64px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--pri);font-weight:900;font-size:32px}
.logo.sm{width:38px;height:38px;border-radius:10px;font-size:20px}
.logo img{width:100%;height:100%;object-fit:contain}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=checkbox]{width:auto}
input[type=file]{display:none}
textarea{min-height:64px}
button,.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button.ghost,.btn.ghost{background:var(--soft);color:var(--pri)}
button.bad{background:var(--bad)}button.ok{background:var(--ok)}
button.sm{padding:7px 10px;font-size:13px}
button.block{width:100%;margin-top:14px}
.price{font-weight:700;white-space:nowrap}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--bd)}
.li:last-child{border:0}
.note{border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}.n-ok{background:#dcf5e6;color:#0f7a41}.n-warn{background:#fff3d6;color:#8a5a00}.n-info{background:var(--soft);color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft);color:var(--pri)}
.b-baru{background:#fff3d6;color:#8a5a00}.rcpt{background:#fff;color:#000;border:1px dashed #bbb;border-radius:8px;padding:12px;margin:10px auto 0;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-width:300px}
.rcpt .c{text-align:center}.rcpt hr{border:0;border-top:1px dashed #000;margin:8px 0}.rcpt .r{display:flex;justify-content:space-between;gap:8px}.rcpt .t{font-weight:700;font-size:14px}.rcpt img{max-height:44px;max-width:120px;filter:grayscale(1)}
.rpt{background:#fff;color:#000;border-radius:8px;padding:14px;margin-top:10px;font:13px/1.5 system-ui,sans-serif}
.rpt h3{margin:14px 0 4px;font-size:14px}.rpt table{font-size:13px}.rpt td,.rpt th{color:#000;border-bottom:1px solid #ddd;padding:4px 2px}.rpt .tot td{font-weight:700;border-top:2px solid #000}
.fbars{display:flex;gap:3px;align-items:flex-end;height:100px;margin-top:8px}.fbars .d{flex:1;display:flex;gap:1px;align-items:flex-end;height:100%}.fbars i{flex:1;display:block;border-radius:3px 3px 0 0;min-height:2px}
@media print{body{background:#fff;padding:0}#app,#toast{display:none!important}#sheet{position:static!important;display:block!important;background:none!important}#sheet .in{max-height:none!important;overflow:visible!important;padding:0!important;border-radius:0!important;background:#fff!important;color:#000!important}.noprint{display:none!important}.rcpt{border:0;max-width:72mm}@page{margin:4mm}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}.chips button{flex:none}
.b-antri{background:#fff3d6;color:#8a5a00}.b-konfirmasi{background:#dff0ff;color:#0b5cad}.b-proses{background:#e9e1ff;color:#5b34c9}.b-selesai{background:#dcf5e6;color:#0f7a41}.b-batal{background:#fde2df;color:#b3261e}
.nav{overflow-x:auto;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1 0 62px;background:none;color:var(--mut);font-size:11px;padding:6px 2px;font-weight:600}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--pri)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--soft);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px;opacity:.85}
.bars small{display:block;text-align:center;font-size:10px;color:var(--mut);margin-top:3px}
#sheet{position:fixed;inset:0;background:rgba(5,10,30,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111a;backdrop-filter:blur(6px);color:#fff;padding:10px 16px;border-radius:99px;z-index:30;display:none;max-width:90%;font-size:14px;background:#0f1b3dee}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;border:1px solid var(--bd)}
.photos .add{width:92px;height:92px;border:2px dashed var(--bd);border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;cursor:pointer}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.ba img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}
.ba i{font-size:11px;color:var(--mut);font-style:normal;display:block;text-align:center}
.tag{font-size:12px;color:var(--mut)}
.demo{background:#fff3d6;color:#6b4700;padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mut)}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.srow{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="sheet"><div class="in" id="sheetIn"></div></div>
<div id="toast"></div>

<script>
/* ========== PENGATURAN ==========
   Tempel URL Web App Apps Script (hasil Deploy, berakhiran /exec) di bawah ini.
   Dikosongkan = mode demo (data hanya di browser ini). */
const API_URL='';
const MODE=API_URL?'api':'local';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const normPlate=v=>String(v==null?'':v).toUpperCase().replace(/[^A-Z0-9]/g,'');
const clone=o=>JSON.parse(JSON.stringify(o));
const fdate=s=>{if(!s)return'-';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3200)}

/* ---------- defaults (dari banner BCar Wash) ---------- */
const DEF={
 brand:{name:'BCar Wash & Detailing',tagline:'Mobil bersih, pikiran jernih',logo:'',color:'#1e5bd8'},
 contact:{address:'Jl. Raya Bringkang No.109, Bringkang, Menganti, Gresik',phones:'0821 4206 6683 | 0822 3420 0081',hours:'07.00 - 20.00 WIB',wa:'6282142066683'},
 commissionRate:30,
 priceView:'tabs',
 loyalty:{on:true,every:10,type:'free',text:'Cuci gratis 1x',pct:0,maxPrice:55000},
 comeback:{on:true,type:'discount',text:'Diskon 20% untuk kunjungan berikutnya',pct:20,maxPrice:0},inactiveDays:30,
 services:[
  {id:'s1',name:'Cuci Motor Kecil',type:'motor',price:15000,duration:15,cat:'Motor',rate:'',desc:''},
  {id:'s2',name:'Cuci Motor Besar',type:'motor',price:20000,duration:20,cat:'Motor',rate:'',desc:''},
  {id:'s3',name:'Standart Car Wash',type:'mobil',price:50000,duration:45,cat:'Cuci Mobil',rate:'',desc:'Harga 50-55K sesuai ukuran mobil'},
  {id:'s4',name:'Cuci & Wax Premium',type:'mobil',price:150000,duration:90,cat:'Cuci Mobil',rate:'',desc:'Cuci body & vacuum, wax premium, interior dressing, glass coat, fogging anti bakteri'},
  {id:'s5',name:'Cuci Kolong',type:'mobil',price:80000,duration:60,cat:'Cuci Mobil',rate:'',desc:''},
  {id:'s6',name:'Engine Cleaning',type:'mobil',price:250000,duration:60,cat:'Detailing',rate:'',desc:''},
  {id:'s7',name:'Cuci & Detailing Express',type:'mobil',price:350000,duration:120,cat:'Detailing',rate:'',desc:''},
  {id:'s8',name:'Promo Cuci Premium',type:'mobil',price:350000,duration:180,cat:'Cuci Mobil',rate:'',desc:'Body & vacuum, mesin detailing, kolong, wax, interior dressing, glass coat, engsel pintu, noda aspal, fogging. Garansi hujan cuci body 2x24 jam'},
  {id:'s9',name:'Interior Detailing',type:'mobil',price:650000,duration:240,cat:'Detailing',rate:'',desc:'Doortrim, plafon, jok, karpet, engsel pintu, cabin fogging & disinfectant'},
  {id:'s10',name:'Coating Headlamp',type:'mobil',price:400000,duration:90,cat:'Detailing',rate:'',desc:''}
 ],
 packages:[
  {id:'p1',name:'Member Motor Kecil 4x',serviceId:'s1',visits:4,bonus:0,price:50000,days:30},
  {id:'p2',name:'Member Car Wash 4x',serviceId:'s3',visits:4,bonus:0,price:180000,days:30},
  {id:'p3',name:'Member Wax Premium 2x',serviceId:'s4',visits:2,bonus:0,price:270000,days:60},
  {id:'p4',name:'Promo Cuci 10x Gratis 1x (Car Wash)',serviceId:'s3',visits:10,bonus:1,price:500000,days:180},
  {id:'p5',name:'Promo Cuci Motor 10x Gratis 1x',serviceId:'s1',visits:10,bonus:1,price:150000,days:180}
 ],
 staff:[
  {id:'u0',name:'Owner',username:'admin',pin:'1234',role:'admin',active:true},
  {id:'u1',name:'Andi',username:'andi',pin:'1111',role:'staff',active:true},
  {id:'u2',name:'Budi',username:'budi',pin:'1111',role:'staff',active:true},
  {id:'u3',name:'Candra',username:'candra',pin:'1111',role:'staff',active:true},
  {id:'u4',name:'Dedi',username:'dedi',pin:'1111',role:'staff',active:true},
  {id:'u5',name:'Eko',username:'eko',pin:'1111',role:'staff',active:true}
 ]
};

/* ---------- state ---------- */
const S={cfg:clone(DEF),bookings:[],jobs:[],members:[],expenses:[],sess:null,screen:'public',pub:'home',memView:'list',finRange:'month',finFrom:'',finTo:'',priceTab:'',priceOpen:'',custF:'all',custQ:'',tab:'dash',draft:null,sheet:null,month:today().slice(0,7),vehicle:'mobil',done:null,lastBooking:null};
let db=null;
const svc=id=>S.cfg.services.find(x=>x.id===id)||{name:'(dihapus)',price:0,type:'mobil'};
const fdur=m=>{m=+m;if(!m)return'';const h=Math.floor(m/60),r=m%60;return h?(h+' jam'+(r?' '+r+' mnt':'')):(m+' menit')};
const stf=id=>S.cfg.staff.find(x=>x.id===id);
const me=()=>stf(S.sess);
const isAdmin=()=>me()&&me().role==='admin';
const jst=j=>j.staffIds&&j.staffIds.length?j.staffIds:(j.staffId?[j.staffId]:[]);
const paidFor=(j,id)=>j.paid||(j.paidBy||[]).includes(id);

/* ---------- storage ---------- */
function localLoad(){try{const x=JSON.parse(localStorage.getItem('bcw')||'null');if(x){Object.assign(S.cfg,x.cfg||{});S.bookings=x.bookings||[];S.jobs=x.jobs||[];S.members=x.members||[];S.expenses=x.expenses||[]}}catch(e){}}
function localSave(){try{localStorage.setItem('bcw',JSON.stringify({cfg:S.cfg,bookings:S.bookings,jobs:S.jobs,members:S.members,expenses:S.expenses}))}catch(e){}}
/* ---------- koneksi Apps Script ---------- */
async function api(action,payload){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.tok||''},payload||{}))});
  let j;try{j=await r.json()}catch(e){throw new Error('Server tidak merespons')}
  if(!j.ok){const e=new Error(j.error||'Terjadi kesalahan');e.code=j.code||'';if(e.code==='auth')authLost();throw e}
  return j;
}
function authLost(){
  if(!S.tok)return;
  S.tok='';S.sess=null;try{localStorage.removeItem('bcw_tok')}catch(e){}
  S.jobs=[];S.bookings=[];S.members=[];S.expenses=[];S.draft=null;S.sheet=null;S.screen='login';
  toast('Sesi berakhir, silakan login lagi');render();
}
const upsertLocal=(col,obj)=>{const i=S[col].findIndex(x=>x.id===obj.id);if(i>=0)S[col][i]=obj;else S[col].unshift(obj)};
function normCfg(c){
  S.cfg=Object.assign(clone(DEF),clone(c));
  S.cfg.services.forEach(x=>{const o=DEF.services.find(y=>y.id===x.id);
    if(x.duration==null)x.duration=o?o.duration:0;
    if(!x.cat)x.cat=o?o.cat:(x.type==='motor'?'Motor':'Cuci Mobil')});
}
async function put(col,obj){
  if(MODE==='api'){
    try{
      if(!S.tok&&col==='bookings'){const r=await api('createBooking',{booking:obj});Object.assign(obj,r.booking);upsertLocal(col,obj);return true}
      await api('set',{col,id:obj.id,data:clone(obj)});
    }catch(e){toast(e.message||'Gagal menyimpan');return false}
  }
  upsertLocal(col,obj);if(MODE==='local')localSave();return true;
}
async function putMany(col,arr){
  if(MODE==='api'){try{for(let i=0;i<arr.length;i+=20)await api('batch',{ops:arr.slice(i,i+20).map(o=>({op:'set',col,id:o.id,data:o}))})}catch(e){toast(e.message||'Gagal menyimpan');return false}}
  arr.forEach(o=>upsertLocal(col,o));if(MODE==='local')localSave();return true;
}
async function delMany(col,ids){
  if(!ids.length)return true;
  if(MODE==='api'){try{for(let i=0;i<ids.length;i+=20)await api('batch',{ops:ids.slice(i,i+20).map(id=>({op:'remove',col,id}))})}catch(e){toast(e.message||'Gagal menghapus');return false}}
  S[col]=S[col].filter(x=>!ids.includes(x.id));if(MODE==='local')localSave();return true;
}
const del=(col,id)=>delMany(col,[id]);
async function saveCfg(){
  if(MODE==='api'){try{await api('setConfig',{cfg:clone(S.cfg)})}catch(e){toast(e.message||'Gagal menyimpan');return false}}
  else localSave();
  return true;
}
async function saveImg(dataUrl){
  if(MODE==='api'&&S.tok){const r=await api('upload',{dataUrl});return r.url}
  return dataUrl;
}
let lastSync=0,syncing=false;
function applyDocs(docs){
  const cr=docs.config||[];
  if(cr.length){const c=cr[cr.length-1];if(!c.d&&c.data)normCfg(c.data)}
  ['bookings','jobs','members','expenses'].forEach(col=>{
    (docs[col]||[]).forEach(r=>{if(r.d)S[col]=S[col].filter(x=>x.id!==r.id);else upsertLocal(col,Object.assign({},r.data,{id:r.id}))});
    S[col].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  });
}
async function syncNow(full){
  if(syncing||MODE!=='api'||!S.tok)return;
  syncing=true;
  try{
    if(full){S.bookings=[];S.jobs=[];S.members=[];S.expenses=[];lastSync=0}
    const r=await api('sync',{since:lastSync});
    if(!r.unchanged){applyDocs(r.docs);soft()}
    lastSync=r.now;
  }catch(e){}finally{syncing=false}
}
async function loadPublic(){
  try{const r=await api('publicState');normCfg(r.cfg);S.bookings=r.bookings;S.jobs=r.jobs;S.members=[];S.expenses=[];soft()}catch(e){}
}
async function boot(){
  if(MODE==='api'){
    try{S.tok=localStorage.getItem('bcw_tok')||''}catch(e){}
    await loadPublic();
    if(S.tok){
      try{const r=await api('me');S.sess=r.user.id;await syncNow(true);S.screen='app';S.tab=r.user.role==='admin'?'dash':'book'}
      catch(e){S.tok='';S.sess=null;try{localStorage.removeItem('bcw_tok')}catch(_){}}
    }
    let tick=0;
    setInterval(()=>{if(document.hidden)return;tick++;
      if(S.tok)syncNow();
      else if(S.screen==='public'&&S.pub==='home'&&tick%2===0)loadPublic()},7000);
  }else{
    try{S.sess=localStorage.getItem('bcw_sess')||null}catch(e){}
    localLoad();
    if(S.sess&&me()&&me().active)S.screen='app';else S.sess=null;
  }
  render();
}
function soft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#app'))return;if(S.sheet||S.draft&&S.screen==='app')return;render()}

/* ---------- images ---------- */
function shrink(file,max,q,type){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const r=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(type||'image/jpeg',q))};im.onerror=rej;im.src=u})}

/* ---------- render ---------- */
function theme(){document.documentElement.style.setProperty('--pri',S.cfg.brand.color||'#1e5bd8')}
function logo(sm){const b=S.cfg.brand;return `<div class="logo${sm?' sm':''}">${b.logo?`<img src="${esc(b.logo)}" alt="">`:esc((b.name||'B').trim()[0]||'B')}</div>`}
function render(){theme();const a=$('#app');
  if(S.screen==='login')a.innerHTML=vLogin();
  else if(S.screen==='app'&&me())a.innerHTML=vApp();
  else{S.screen='public';a.innerHTML=vPublic()}
  document.title=S.cfg.brand.name;
  if(S.sheet)renderSheet();
}
const demoBar=()=>MODE==='api'?'':'<div class="demo">Mode demo: data hanya tersimpan di browser ini.</div>';

/* ----- antrian & ketersediaan karyawan ----- */
const dupActive=d=>{const pl=normPlate(d.plate);return pl?S.jobs.find(j=>j.id!==d.id&&(j.status==='antri'||j.status==='proses')&&normPlate(j.plate)===pl):null};
const hm=v=>{const d=v?new Date(v):new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const dmin=id=>(+svc(id).duration)||30;
const workers=()=>S.cfg.staff.filter(u=>u.active&&u.role==='staff');
const endOf=j=>new Date(j.startedAt||j.createdAt||Date.now()).getTime()+dmin(j.serviceId)*60000;
function busyIds(exceptId){const b=new Set();S.jobs.forEach(j=>{if(j.status==='proses'&&j.id!==exceptId)jst(j).forEach(i=>b.add(i))});return b}
function defStaff(){if(me()&&me().role==='staff')return [me().id];const b=busyIds();const w=workers().find(u=>!b.has(u.id));return w?[w.id]:[]}
function queueInfo(){
  const now=Date.now(),W=workers(),idx={},frees=W.map(()=>now);W.forEach((u,i)=>idx[u.id]=i);
  const working=S.jobs.filter(j=>j.status==='proses');
  working.forEach(j=>{const e=endOf(j);jst(j).forEach(id=>{if(idx[id]!=null)frees[idx[id]]=Math.max(frees[idx[id]],e)})});
  const busy=busyIds(),avail=W.filter(u=>!busy.has(u.id)).length;
  const items=[];
  S.jobs.filter(j=>j.status==='antri').forEach(j=>items.push({k:hm(j.createdAt),plate:j.plate,serviceId:j.serviceId}));
  S.bookings.filter(b=>b.date===today()&&(b.status==='baru'||b.status==='konfirmasi')).forEach(b=>items.push({k:b.time,plate:b.plate,serviceId:b.serviceId,at:new Date(b.date+'T'+b.time+':00').getTime()}));
  items.sort((a,b)=>a.k.localeCompare(b.k));
  const f=frees.length?frees.slice():[now];
  items.forEach(x=>{let m=0;f.forEach((v,i)=>{if(v<f[m])m=i});x.start=Math.max(f[m],now,x.at||0);f[m]=x.start+dmin(x.serviceId)*60000});
  return {total:W.length,avail,items,working,now};
}

  const by={};list.forEach(j=>{const ids=jst(j),n=ids.length||1,share=Math.round((+j.commission||0)/n),sb=Math.round((+j.base||0)/n);ids.forEach(id=>{if(!isAdmin()&&id!==S.sess)return;const r=by[id]=by[id]||{n:0,sales:0,com:0,unpaid:0};r.n++;r.sales+=sb;r.com+=share;if(!paidFor(j,id))r.unpaid+=share})});

/* keuangan */
function finBounds(){
  const t=today();let f=t.slice(0,8)+'01',e=t;
  if(S.finRange==='today')f=t;
  else if(S.finRange==='week')f=addDays(t,-6);
  else if(S.finRange==='last'){const d=new Date(t+'T00:00:00');f=ymd(new Date(d.getFullYear(),d.getMonth()-1,1));e=ymd(new Date(d.getFullYear(),d.getMonth(),0))}
  else if(S.finRange==='custom'){f=S.finFrom||t;e=S.finTo||t;if(e<f)e=f}
  return [f,e];
}
function finData(){
  const [f,e]=finBounds(),inR=d=>!!d&&d>=f&&d<=e;
  const jobs=S.jobs.filter(j=>j.status==='selesai'&&!j.demo&&inR(j.doneDate));
  const mems=S.members.filter(m=>!m.demo&&inR(m.created));
  const exps=S.expenses.filter(x=>inR(x.date)).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));
  const sum=(a,fn)=>a.reduce((t,x)=>t+(+fn(x)||0),0);
  const incJ=sum(jobs,j=>j.price),incM=sum(mems,m=>m.paid),com=sum(jobs,j=>j.commission),expT=sum(exps,x=>x.amount);
  const meth={},cat={},svcs={},ecat={},perDay={};
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v},day=(d,k,v)=>{(perDay[d]=perDay[d]||{in:0,out:0})[k]+=v};
  jobs.forEach(j=>{const v=+j.price||0;if(v>0)add(meth,j.payMethod||'Tunai',v);const sv=svc(j.serviceId);add(cat,sv.cat||'Lainnya',v);const r=svcs[sv.name]=svcs[sv.name]||{n:0,v:0};r.n++;r.v+=v;day(j.doneDate,'in',v)});
  mems.forEach(m=>{const v=+m.paid||0;add(meth,m.payMethod||'Tunai',v);add(cat,'Paket Member',v);day(m.created,'in',v)});
  exps.forEach(x=>{const v=+x.amount||0;add(ecat,x.cat||'Lain-lain',v);day(x.date,'out',v)});
  return {f,e,jobs,mems,exps,incJ,incM,inc:incJ+incM,com,expT,out:expT+com,net:incJ+incM-expT-com,meth,cat,svcs,ecat,perDay,tx:jobs.length+mems.length,paidTx:jobs.filter(j=>+j.price>0).length+mems.length};
}
const kv=(o)=>Object.entries(o).sort((a,b)=>b[1]-a[1]);

  const mx=Math.max(1,...days.map(d=>Math.max((D.perDay[d]||{}).in||0,(D.perDay[d]||{}).out||0)));
  const row=(a,b,bold)=>`<div class="li"><div${bold?' style="font-weight:700"':''}>${a}</div><div class="price">${b}</div></div>`;

  return `<h2 style="margin:12px 0 0">Keuangan</h2>

  ${S.finRange==='custom'?`<div class="grid2"><div><label>Dari</label><input type="date" id="finFrom" value="${D.f}"></div><div><label>Sampai</label><input type="date" id="finTo" value="${D.e}"></div></div>`:''}

  <div class="stat">Laba bersih<b>${rp(D.net)}</b></div><div class="stat">Transaksi<b>${D.tx}</b></div></div>
  <div class="card"><h2>Ringkasan</h2>${row('Pemasukan cuci & layanan',rp(D.incJ))}${row('Pemasukan paket member',rp(D.incM))}${row('Total pemasukan',rp(D.inc),1)}
  ${row('Pengeluaran operasional',rp(D.expT))}${row('Komisi karyawan (dari pekerjaan)',rp(D.com))}${row('Total pengeluaran',rp(D.out),1)}${row('Laba bersih',rp(D.net),1)}
  ${row('Rata-rata per transaksi berbayar',rp(D.paidTx?D.inc/D.paidTx:0))}</div>
  <div class="card"><h2>Pemasukan per metode bayar</h2>${list(D.meth)}</div>
  <div class="card"><h2>Pemasukan per kategori</h2>${list(D.cat)}</div>
  <div class="card"><h2>Layanan terlaris</h2>${top.map(([n,r])=>row(esc(n)+' <span class="tag">'+r.n+'x</span>',rp(r.v))).join('')||'<div class="mut">Belum ada data.</div>'}</div>
  ${days.length>1?`<div class="card"><h2>Per hari</h2><div class="tag"><span style="color:var(--pri)">■</span> pemasukan &nbsp; <span style="color:var(--bad)">■</span> pengeluaran</div>
  <div class="fbars">${days.map(d=>{const x=D.perDay[d]||{in:0,out:0};return `<div class="d" title="${d}"><i style="height:${Math.round(x.in/mx*100)}%;background:var(--pri)"></i><i style="height:${Math.round(x.out/mx*100)}%;background:var(--bad)"></i></div>`}).join('')}</div>
  <div class="row sp tag"><span>${fdate(D.f)}</span><span>${fdate(D.e)}</span></div></div>`:''}

/* ----- format teks printer thermal ----- */
const asc=t=>String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7E]/g,'');
function wrapT(t,W){const w=asc(t).split(/\s+/).filter(Boolean),o=[];let l='';
  w.forEach(x=>{while(x.length>W){if(l){o.push(l);l=''}o.push(x.slice(0,W));x=x.slice(W)}
    if(!l)l=x;else if((l+' '+x).length<=W)l+=' '+x;else{o.push(l);l=x}});
  if(l)o.push(l);return o}
const ctr=(t,W)=>wrapT(t,W).map(l=>' '.repeat(Math.max(0,Math.floor((W-l.length)/2)))+l);
function lr(a,b,W){a=asc(a);b=asc(b);const room=W-b.length-1;
  if(a.length<=room)return [a+' '.repeat(W-a.length-b.length)+b];
  const o=wrapT(a,W);o.push(' '.repeat(Math.max(0,W-b.length))+b);return o}
function notaThermal(n,W){
  const c=S.cfg,k=c.contact,hr='-'.repeat(W),L=[];
  L.push(...ctr(String(c.brand.name).toUpperCase(),W),...ctr(k.address,W),...ctr(k.phones,W),hr);
  L.push(...lr('No',n.no,W),...lr('Tgl',fdt(n.at),W));
  if(n.customer)L.push(...lr('Pelanggan',n.customer,W));
  if(n.plate)L.push(...lr('Plat',n.plate,W));
  if(n.staff)L.push(...lr('Karyawan',n.staff,W));
  L.push(hr);
  n.lines.forEach(x=>L.push(...lr(x[0],(x[1]<0?'-':'')+rp(Math.abs(x[1])),W)));
  n.notes.forEach(x=>L.push(...wrapT(x,W)));
  L.push(hr,...lr('TOTAL',rp(n.total),W),...lr('Bayar',n.method,W),hr,...ctr(c.brand.tagline||'',W),...ctr('Terima kasih',W),'','');
  return L.join('\n');
}
function repThermal(D,W){
  const c=S.cfg,hr='-'.repeat(W);
  const L=[...ctr('LAPORAN KEUANGAN',W),...ctr(c.brand.name,W),...ctr(fdate(D.f)+' - '+fdate(D.e),W),hr,
   ...lr('Pemasukan layanan',rp(D.incJ),W),...lr('Paket member',rp(D.incM),W),...lr('TOTAL MASUK',rp(D.inc),W),hr,
   ...lr('Pengeluaran',rp(D.expT),W),...lr('Komisi',rp(D.com),W),...lr('TOTAL KELUAR',rp(D.out),W),hr,
   ...lr('LABA BERSIH',rp(D.net),W),...lr('Transaksi',String(D.tx),W),hr];
  kv(D.meth).forEach(([k,v])=>L.push(...lr(k,rp(v),W)));
  L.push('','');return L.join('\n');
}
function thermalUI(text,copyAct){
  const W=S.paper||32;
  return `<div class="noprint" style="margin-top:14px"><div class="row"><span class="tag">Printer thermal, lebar kertas:</span><button class="sm ${W===32?'':'ghost'}" data-a="paper" data-v="32">58 mm</button><button class="sm ${W===48?'':'ghost'}" data-a="paper" data-v="48">80 mm</button></div>
  <pre style="font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:#000;border:1px dashed #bbb;border-radius:8px;padding:8px;overflow-x:auto;margin:8px 0;white-space:pre">${esc(text)}</pre>
  <button class="block" data-a="${copyAct}">📋 Salin untuk printer thermal</button>
  <div class="tag" style="margin-top:6px">Tempel ke aplikasi printer thermal (misalnya RawBT atau Bluetooth Print) memakai font monospace.</div></div>`;
}

function clearReward(d){d.reward=null;d.loyaltyFree=false;d.price=svc(d.serviceId).price}
function applyReward(d,kind){
  const c=kind==='loyal'?loyCfg():cbCfg(),base=svc(d.serviceId).price;
  d.reward={kind,type:c.type,text:c.text,pct:c.pct};d.memberId='';
  if(c.type==='free'){d.price=0;d.loyaltyFree=true}
  else if(c.type==='discount'){d.price=Math.round(base*(100-Math.min(100,c.pct))/100);d.loyaltyFree=false}

function custStats(){
  const by={};
  const get=pl=>by[pl]=by[pl]||{plate:pl,name:'',phone:'',visits:0,member:0,paid:0,free:0,spent:0,last:'',jobs:[]};
  S.jobs.filter(j=>j.status==='selesai').forEach(j=>{const pl=normPlate(j.plate);if(!pl)return;const c=get(pl);
    c.visits++;c.jobs.push(j);if(j.demo)c.demo=true;
    if(j.memberId)c.member++;else if(j.loyaltyFree||(j.reward&&j.reward.kind==='loyal'))c.free++;else c.paid++;
    c.spent+=+j.price||0;
    if((j.doneDate||'')>=c.last){c.last=j.doneDate||'';c.name=j.customer||c.name;c.phone=j.phone||c.phone}});
  S.members.forEach(m=>{const pl=normPlate(m.plate);if(!pl)return;const c=get(pl);c.spent+=+m.paid||0;if(!c.name){c.name=m.name;c.phone=m.phone}});

  const days=daysSince(c.last),li=loyInfo(c),cb=cbCfg(),inactive=isInactive(c),brand=S.cfg.brand.name;
  const rw=[];if(li.on&&li.avail>0)rw.push(li.text);if(cb.on)rw.push(cb.text);
  const msg='Halo '+(c.name||'')+', kendaraan '+c.plate+' sudah '+days+' hari belum dicuci di '+brand+'. Yuk mampir lagi!'+(rw.length?' Ada hadiah untuk Anda: '+rw.join(' / ')+'.':'');

  return `<div class="row sp"><h2 style="margin:0">${esc(c.plate)}</h2><button class="ghost sm" data-a="sheetClose">Tutup</button></div>
  <div>${esc(c.name||'-')}</div>
  <div class="row" style="margin-top:6px">${c.phone?`<a class="btn ghost sm" href="tel:${esc(c.phone)}">📞 Telepon</a>`:''}${c.phone&&inactive?`<a class="btn ok sm" target="_blank" href="${esc(waLink(c.phone,msg))}">💬 Ingatkan via WA</a>`:''}</div>
  <div class="grid2" style="margin-top:10px"><div class="stat">Kedatangan<b>${c.visits}x</b></div><div class="stat">Total belanja<b>${rp(c.spent)}</b></div></div>
  <div class="mut" style="margin-top:8px">${c.paid} berbayar · ${c.member} member · ${c.free} hadiah dipakai · terakhir ${c.last?fdate(c.last)+' ('+days+' hari lalu)':'-'}</div>
  ${li.on?`<div class="note ${li.avail>0?'n-ok':'n-info'}">${li.avail>0?'🎁 Berhak: '+esc(li.text)+' ('+li.avail+'x)':'Loyalitas: '+li.prog+'/'+li.N+' cuci berbayar menuju hadiah'}</div>`:''}
  ${inactive?`<div class="note n-warn">💤 Sudah ${days} hari tidak datang.${cb.on?' Hadiah kembali: '+esc(cb.text):''}</div>`:''}
  <h2 style="margin-top:14px">Riwayat</h2>${hist}`;
}

/* ----- deteksi member dari plat ----- */
function memberMsgs(plateRaw,serviceId,pub,src){
  const pl=normPlate(plateRaw),out=[];if(pl.length<3)return out;
  const mine=(src||S.members).filter(m=>normPlate(m.plate)===pl),td=today();
  if(!mine.length){if(!pub)out.push({t:'info',m:'Plat '+pl+' belum terdaftar sebagai member.'});return out}
  mine.forEach(m=>{
    const nm=esc(m.pkgName);
    if(m.serviceId!==serviceId){out.push({t:'info',m:'Plat '+pl+' terdaftar member untuk layanan '+esc(svc(m.serviceId).name)+', tidak berlaku untuk layanan ini.'});return}
    if(m.visitsLeft<=0){out.push({t:'warn',m:'⚠️ Member “'+nm+'” sisa kunjungan sudah habis. Tawarkan perpanjangan paket.'});return}
    if(m.expires<td){out.push({t:'warn',m:'⚠️ Member “'+nm+'” kadaluarsa sejak '+fdate(m.expires)+' (sisa '+m.visitsLeft+'x tidak bisa dipakai). Tawarkan perpanjangan.'});return}
    out.push({t:'ok',m:'✅ Member terdeteksi'+(pub?'':': '+esc(m.name)+' · '+nm)+' · sisa '+m.visitsLeft+'x · berlaku s/d '+fdate(m.expires)});
    if(m.visitsLeft===1)out.push({t:'warn',m:'⚠️ Ini kunjungan terakhir member. Tawarkan perpanjangan paket.'});
    const dl=Math.round((new Date(m.expires+'T00:00:00')-new Date(td+'T00:00:00'))/864e5);
    if(dl<=7)out.push({t:'warn',m:'⚠️ Masa berlaku member '+(dl===0?'berakhir hari ini':'tinggal '+dl+' hari')+'.'});
  });
  return out;
}
const notesHtml=a=>a.map(x=>`<div class="note n-${x.t}">${x.m}</div>`).join('');
function autoMember(d){
  if(d.status==='selesai')return;
  const pl=normPlate(d.plate),key=pl+'|'+d.serviceId,prev=d._ak;
  if(prev===key)return;d._ak=key;
  if(prev&&(d.reward||d.loyaltyFree))clearReward(d);
  if(!prev&&d.status==='proses')return;
  const cur=d.memberId&&S.members.find(m=>m.id===d.memberId);
  if(prev&&cur&&normPlate(cur.plate)!==pl){d.memberId='';d.price=svc(d.serviceId).price}
  if(!d.memberId&&pl.length>=3){
    const td=today(),v=S.members.find(m=>normPlate(m.plate)===pl&&m.serviceId===d.serviceId&&m.visitsLeft>0&&m.expires>=td);
    if(v){d.memberId=v.id;d.price=0;d.loyaltyFree=false;d.reward=null}
  }
}
function memBoxHtml(d){
  const pl=normPlate(d.plate),td=today();
  const mems=S.members.filter(m=>(m.serviceId===d.serviceId&&m.visitsLeft>0&&m.expires>=td)||m.id===d.memberId).sort((a,b)=>(normPlate(b.plate)===pl)-(normPlate(a.plate)===pl));
  return `<label>Pakai membership?</label><select data-j="memberId" data-re="1"><option value="">Tidak (bayar tunai)</option>${mems.map(m=>`<option value="${m.id}" ${m.id===d.memberId?'selected':''}>${esc(m.name)} · ${esc(m.plate)} · sisa ${m.visitsLeft}x</option>`).join('')}</select>`+notesHtml(memberMsgs(d.plate,d.serviceId,false))+loyHtml(d);
}

let bkT=0;
function bkNote(){const f=$('#bkForm'),el=$('#bkNote');if(!f||!el)return;
  if(MODE==='api'&&!S.tok){
    clearTimeout(bkT);const pl=normPlate(f.plate.value),sid=f.serviceId.value;
    if(pl.length<3){el.innerHTML='';return}
    bkT=setTimeout(async()=>{try{const r=await api('memberStatus',{plate:pl});const e2=$('#bkNote');if(e2&&$('#bkForm'))e2.innerHTML=notesHtml(memberMsgs(pl,sid,true,r.members.map(m=>Object.assign({plate:pl},m))))}catch(err){}},500);
    return}
  el.innerHTML=notesHtml(memberMsgs(f.plate.value,f.serviceId.value,true))}

  const s=svc(d.serviceId);
  if(d.memberId&&!d.deducted){const m=S.members.find(x=>x.id===d.memberId);if(!m||m.visitsLeft<=0){toast('Sisa kunjungan member habis');return false}
    m.visitsLeft--;await put('members',m);d.deducted=true;d.price=0}
  const rate=(s.rate===''||s.rate==null)?S.cfg.commissionRate:+s.rate;
  d.base=+s.price;d.commission=Math.round(d.base*rate/100);d.status='selesai';d.doneDate=today();d.doneAt=new Date().toISOString();if(!d.notaNo)d.notaNo=nextNota('NT',d.doneDate);return true;
}

  if(t.dataset.p&&S.draft&&t.tagName==='SELECT'){setPath(S.draft,t.dataset.p,t.value);pkgTouch(t.dataset.p);if(t.dataset.p.startsWith('staff'))return}
  if(t.dataset.j&&t.dataset.re&&S.sheet){const d=S.sheet.d;d[t.dataset.j]=t.value;
    if(t.dataset.j==='serviceId'){d.memberId='';d.reward=null;d.loyaltyFree=false;d.price=svc(d.serviceId).price;autoMember(d)}
    if(t.dataset.j==='memberId'){d.reward=null;d.loyaltyFree=false;d.price=t.value?0:svc(d.serviceId).price}
    renderSheet()}
  else if(t.dataset.j&&S.sheet&&t.tagName==='SELECT')S.sheet.d[t.dataset.j]=t.value;
  if(t.dataset.ph&&t.files[0]){try{if(MODE==='api')toast('Mengunggah foto...');const u=await saveImg(await shrink(t.files[0],MODE==='api'?900:560,MODE==='api'?.7:.55));const d=S.sheet.d;(d[t.dataset.ph]=d[t.dataset.ph]||[]).push(u);renderSheet()}catch(err){toast(err.message||'Foto gagal diunggah')}}
  if(t.id==='logoF'&&t.files[0]){try{S.draft.brand.logo=await saveImg(await shrink(t.files[0],256,.9,'image/png'));render()}catch(err){toast(err.message||'Logo gagal diunggah')}}
});

/* forms */
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
  if(f.id==='loginForm'){const u=f.u.value.trim().toLowerCase(),p=f.p.value.trim();
    if(MODE==='api'){
      if(S.lock)return;S.lock=true;toast('Masuk...');
      try{const r=await api('login',{u,p});S.tok=r.token;try{localStorage.setItem('bcw_tok',r.token)}catch(err){}
        S.sess=r.user.id;await syncNow(true);S.screen='app';S.tab=r.user.role==='admin'?'dash':'book';render()}
      catch(err){toast(err.message||'Username atau PIN salah')}
      S.lock=false;return}
    const s=S.cfg.staff.find(x=>x.active&&x.username.toLowerCase()===u&&String(x.pin)===p);
    if(!s){toast('Username atau PIN salah');return}
    S.sess=s.id;try{localStorage.setItem('bcw_sess',s.id)}catch(err){}S.screen='app';S.tab=s.role==='admin'?'dash':'book';render()}
  if(f.id==='bkForm'){if(S.lock)return;S.lock=true;const fd=Object.fromEntries(new FormData(f));
    if(!fd.time||timePassed(fd.date,fd.time)){toast('Jam yang dipilih sudah lewat. Pilih jam berikutnya.');const sel=$('#bkTime');if(sel)sel.innerHTML=timeOptions(fd.date);S.lock=false;return}
    const b={id:uid(),code:'BK'+Math.random().toString(36).slice(2,6).toUpperCase(),name:fd.name.trim(),phone:fd.phone.trim(),vehicle:S.vehicle,plate:normPlate(fd.plate),serviceId:fd.serviceId,date:fd.date,time:fd.time,note:fd.note.trim(),status:'baru',createdAt:new Date().toISOString()};
    const dupB=S.bookings.find(x=>x.status!=='batal'&&x.date===b.date&&x.time===b.time&&normPlate(x.plate)===b.plate&&x.serviceId===b.serviceId);
    if(dupB){toast('Booking yang sama sudah ada ('+dupB.code+')');S.lock=false;return}
    const ok=await put('bookings',b);S.lock=false;if(ok){S.lastBooking=b;render();scrollTo(0,0)}}
});
boot();
setInterval(()=>{const f=$('#bkForm'),sel=$('#bkTime');if(!f||!sel)return;const cur=sel.value;sel.innerHTML=timeOptions(f.date.value);if(!timePassed(f.date.value,cur))sel.value=cur},60000);
</script>
